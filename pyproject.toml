[project]
name = "bifrost"
version = "0.1.0"
description = "Bifrost: cross-chain best-route router over a directed weighted multigraph (Eth + Base v1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
viz = [
  "streamlit>=1.35",
  "pyvis>=0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
